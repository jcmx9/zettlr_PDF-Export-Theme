name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # The Pandoc version Zettlr ships with
  PANDOC_VERSION: "3.10.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts (shellcheck)
        run: shellcheck install.sh scripts/*.sh

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check version in both READMEs
        run: |
          version="$(cat VERSION)"
          for readme in README.md README.en.md; do
            grep -qF "**Version ${version}**" "$readme" || { echo "$readme does not show version ${version}"; exit 1; }
          done

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/

  bootstrap-unix:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then
            zettlr="$HOME/Library/Application Support/zettlr"
          else
            zettlr="$HOME/.config/zettlr"
          fi
          mkdir -p "$zettlr"

          bash install.sh --bundle dist/zettlr-pdf-export-theme.tar.gz
          bash install.sh --bundle dist/zettlr-pdf-export-theme.tar.gz
          test -f "$zettlr/defaults/Source PDF.yaml"
          test -f "$zettlr/snippets/meeting.tpl.md"

          # End to end with Zettlr's Pandoc and a stub for rf-document
          if [ "$(uname -s)" = Darwin ]; then
            curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
            unzip -q pandoc.zip
            export PATH="$PWD/pandoc-$PANDOC_VERSION-arm64/bin:$PATH"
          else
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar -xz
            export PATH="$PWD/pandoc-$PANDOC_VERSION/bin:$PATH"
          fi
          pandoc --version | head -n 1
          ./scripts/test_messenger.sh "$zettlr/defaults/Source PDF.yaml"

          bash install.sh --uninstall
          test ! -e "$zettlr/defaults/Source PDF.yaml"
          test ! -e "$zettlr/snippets/meeting.tpl.md"
          test ! -e "$HOME/.local/share/zettlr-pdf-export-theme"

  bootstrap-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zettlr = Join-Path $env:APPDATA "zettlr"
          New-Item -ItemType Directory -Force -Path $zettlr | Out-Null

          $code = Get-Content -Raw install.ps1
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-pdf-export-theme.zip
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-pdf-export-theme.zip
          foreach ($f in @("$zettlr\defaults\Source PDF.yaml", "$zettlr\snippets\meeting.tpl.md")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" }
          }

          # End to end with Zettlr's Pandoc and a stub for rf-document, in
          # folders with spaces (cmd.exe quoting)
          Invoke-WebRequest -UseBasicParsing -OutFile pandoc.zip "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Expand-Archive pandoc.zip -DestinationPath .
          $pandoc = Join-Path $PWD "pandoc-$env:PANDOC_VERSION\pandoc.exe"
          $notes = Join-Path $env:RUNNER_TEMP "Notizen mit Leerzeichen"
          New-Item -ItemType Directory -Force -Path $notes | Out-Null
          [IO.File]::WriteAllText("$notes\notiz.md", "---`ntitle: Bote`n---`n`n# Test`n")
          $stub = Join-Path $env:RUNNER_TEMP "stub dir\rf-document.cmd"
          New-Item -ItemType Directory -Force -Path (Split-Path $stub) | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "stub.log"
          [IO.File]::WriteAllText($stub, "@echo off`r`n> `"$log`" echo in=%~1`r`n>> `"$log`" echo out=%~2`r`n>> `"$log`" echo noopen=%RFD_NO_OPEN%`r`n>> `"$log`" echo base=%RFD_BASE_DIR%`r`nif not `"%STUB_EXIT%`"==`"`" exit /b %STUB_EXIT%`r`n> `"%~2`" echo %%PDF-1.7 stub`r`n")
          $env:RF_DOCUMENT = $stub
          $target = Join-Path $env:RUNNER_TEMP "out folder\notiz.pdf"
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null

          Push-Location $notes
          & $pandoc -d "$zettlr\defaults\Source PDF.yaml" notiz.md -o $target
          $exit = $LASTEXITCODE
          Pop-Location
          Get-Content $log
          if ($exit -ne 0) { throw "export failed with $exit" }
          if (-not (Test-Path -LiteralPath $target)) { throw "no PDF at the target path" }
          $logText = Get-Content -Raw $log
          if ($logText -notmatch [regex]::Escape("in=$notes\notiz.md")) { throw "input path not passed" }
          if ($logText -notmatch "noopen=1") { throw "RFD_NO_OPEN not set" }
          if ($logText -notmatch [regex]::Escape("base=$notes")) { throw "RFD_BASE_DIR not set" }

          $env:STUB_EXIT = "3"
          Push-Location $notes
          & $pandoc -d "$zettlr\defaults\Source PDF.yaml" notiz.md -o $target
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 3) { throw "exit code $exit instead of 3" }
          Remove-Item Env:STUB_EXIT

          & ([scriptblock]::Create($code)) -Uninstall
          $app = Join-Path $env:LOCALAPPDATA "zettlr-pdf-export-theme"
          if (Test-Path -LiteralPath $app) { throw "app folder left behind" }
          if (Test-Path -LiteralPath "$zettlr\defaults\Source PDF.yaml") { throw "profile left behind" }
          # The failure test above leaves exit code 3 behind on purpose
          exit 0
