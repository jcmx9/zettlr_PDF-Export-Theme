name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # The Pandoc version Zettlr ships with
  PANDOC_VERSION: "3.10.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts (shellcheck)
        run: shellcheck install.sh scripts/*.sh

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check version in both READMEs
        run: |
          version="$(cat VERSION)"
          for readme in README.md README.en.md; do
            grep -qF "**Version ${version}**" "$readme" || { echo "$readme does not show version ${version}"; exit 1; }
          done

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/

  bootstrap-unix:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then
            zettlr="$HOME/Library/Application Support/zettlr"
          else
            zettlr="$HOME/.config/zettlr"
          fi
          mkdir -p "$zettlr"
          printf '/* own rule */\n' > "$zettlr/custom.css"
          cp "$zettlr/custom.css" original.css

          bash install.sh --bundle dist/zettlr-rfdoc-export.tar.gz
          bash install.sh --bundle dist/zettlr-rfdoc-export.tar.gz
          test -f "$zettlr/defaults/rf-doc.yaml"
          test -f "$zettlr/snippets/meeting.tpl.md"
          test -f "$zettlr/rfdoc-zettlr.css" && test -f "$zettlr/rfdoc-zettlr-fonts.css"
          head -n 1 "$zettlr/custom.css" | grep -qF 'rfdoc-zettlr.css'

          # End to end with Zettlr's Pandoc and a stub for rf-document
          if [ "$(uname -s)" = Darwin ]; then
            curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
            unzip -q pandoc.zip
            export PATH="$PWD/pandoc-$PANDOC_VERSION-arm64/bin:$PATH"
          else
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar -xz
            export PATH="$PWD/pandoc-$PANDOC_VERSION/bin:$PATH"
          fi
          pandoc --version | head -n 1
          ./scripts/test_messenger.sh "$zettlr/defaults/rf-doc.yaml"

          bash install.sh --uninstall
          cmp "$zettlr/custom.css" original.css
          test ! -e "$zettlr/rfdoc-zettlr.css"
          test ! -e "$zettlr/defaults/rf-doc.yaml"
          test ! -e "$zettlr/snippets/meeting.tpl.md"
          test ! -e "$HOME/.local/share/zettlr-rfdoc-export"

  bootstrap-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zettlr = Join-Path $env:APPDATA "zettlr"
          New-Item -ItemType Directory -Force -Path $zettlr | Out-Null
          [IO.File]::WriteAllText("$zettlr\custom.css", "/* own rule */`r`n")
          Copy-Item "$zettlr\custom.css" original.css

          $code = Get-Content -Raw install.ps1
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-rfdoc-export.zip
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-rfdoc-export.zip
          foreach ($f in @("$zettlr\defaults\rf-doc.yaml", "$zettlr\snippets\meeting.tpl.md", "$zettlr\rfdoc-zettlr.css", "$zettlr\rfdoc-zettlr-fonts.css")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" }
          }
          if (-not (Get-Content "$zettlr\custom.css" -First 1).Contains("rfdoc-zettlr.css")) { throw "import line missing" }

          # End to end with Zettlr's Pandoc and a stub for rf-document, in
          # folders with spaces (cmd.exe quoting)
          Invoke-WebRequest -UseBasicParsing -OutFile pandoc.zip "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Expand-Archive pandoc.zip -DestinationPath .
          $pandoc = Join-Path $PWD "pandoc-$env:PANDOC_VERSION\pandoc.exe"
          $notes = Join-Path $env:RUNNER_TEMP "Notizen mit Leerzeichen"
          New-Item -ItemType Directory -Force -Path $notes | Out-Null
          [IO.File]::WriteAllText("$notes\notiz.md", "---`ntitle: Bote`n---`n`n# Test`n")
          $stub = Join-Path $env:RUNNER_TEMP "stub dir\rf-document.cmd"
          New-Item -ItemType Directory -Force -Path (Split-Path $stub) | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "stub.log"
          [IO.File]::WriteAllText($stub, "@echo off`r`n> `"$log`" echo in=%~1`r`n>> `"$log`" echo out=%~2`r`n>> `"$log`" echo noopen=%RFD_NO_OPEN%`r`n>> `"$log`" echo base=%RFD_BASE_DIR%`r`nif not `"%STUB_EXIT%`"==`"`" exit /b %STUB_EXIT%`r`n> `"%~2`" echo %%PDF-1.7 stub`r`n")
          $env:RF_DOCUMENT = $stub
          $target = Join-Path $env:RUNNER_TEMP "out folder\notiz.pdf"
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null

          Push-Location $notes
          & $pandoc -d "$zettlr\defaults\rf-doc.yaml" notiz.md -o $target
          $exit = $LASTEXITCODE
          Pop-Location
          Get-Content $log
          if ($exit -ne 0) { throw "export failed with $exit" }
          if (-not (Test-Path -LiteralPath $target)) { throw "no PDF at the target path" }
          $logText = Get-Content -Raw $log
          if ($logText -notmatch [regex]::Escape("in=$notes\notiz.md")) { throw "input path not passed" }
          if ($logText -notmatch "noopen=1") { throw "RFD_NO_OPEN not set" }
          if ($logText -notmatch [regex]::Escape("base=$notes")) { throw "RFD_BASE_DIR not set" }

          $env:STUB_EXIT = "3"
          Push-Location $notes
          & $pandoc -d "$zettlr\defaults\rf-doc.yaml" notiz.md -o $target
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 3) { throw "exit code $exit instead of 3" }
          Remove-Item Env:STUB_EXIT

          & ([scriptblock]::Create($code)) -Uninstall
          if ((Get-FileHash "$zettlr\custom.css").Hash -ne (Get-FileHash original.css).Hash) { throw "custom.css not restored" }
          $app = Join-Path $env:LOCALAPPDATA "zettlr-rfdoc-export"
          if (Test-Path -LiteralPath $app) { throw "app folder left behind" }
          if (Test-Path -LiteralPath "$zettlr\defaults\rf-doc.yaml") { throw "profile left behind" }
          # The failure test above leaves exit code 3 behind on purpose
          exit 0

  # The whole way as in Zettlr, with the real rf-document from its one-liner:
  # note in a folder with spaces, relative image, absolute target with spaces
  real-rf-document:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Export through rf-doc and rf-document (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/jcmx9/real-fast-document/main/scripts/bootstrap.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          rf-document --version
          if [ "$(uname -s)" = Darwin ]; then
            zettlr="$HOME/Library/Application Support/zettlr"
            curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
            unzip -q pandoc.zip
            pandoc="$PWD/pandoc-$PANDOC_VERSION-arm64/bin/pandoc"
          else
            zettlr="$HOME/.config/zettlr"
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar -xz
            pandoc="$PWD/pandoc-$PANDOC_VERSION/bin/pandoc"
          fi
          mkdir -p "$zettlr"
          bash install.sh --bundle dist/zettlr-rfdoc-export.tar.gz

          notes="$RUNNER_TEMP/Notizen mit Leerzeichen"
          target="$RUNNER_TEMP/Export Ziel/notiz.pdf"
          mkdir -p "$notes/bilder" "$(dirname "$target")"
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60"><rect width="200" height="60" fill="#1f6f6a"/></svg>\n' > "$notes/bilder/grafik.svg"
          printf -- '---\ntitle: "Bote"\nclient: "Muster GmbH"\n---\n\n# Test\n\n![Grafik](bilder/grafik.svg)\n\n- [ ] Aufgabe – Name, bis 17.10.\n' > "$notes/notiz.md"
          # Started like a GUI app: minimal PATH
          (cd "$notes" && env -i HOME="$HOME" PATH="/usr/bin:/bin" "$pandoc" --defaults "$zettlr/defaults/rf-doc.yaml" notiz.md -o "$target")
          head -c 5 "$target" | grep -q '%PDF'
          echo "ok: $target"

      - name: Export through rf-doc and rf-document (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          irm https://raw.githubusercontent.com/jcmx9/real-fast-document/main/scripts/bootstrap.ps1 | iex
          # winget installed Typst for later sessions; load the new PATH here
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          $zettlr = Join-Path $env:APPDATA "zettlr"
          New-Item -ItemType Directory -Force -Path $zettlr | Out-Null
          $code = Get-Content -Raw install.ps1
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-rfdoc-export.zip

          Invoke-WebRequest -UseBasicParsing -OutFile pandoc.zip "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Expand-Archive pandoc.zip -DestinationPath .
          $pandoc = Join-Path $PWD "pandoc-$env:PANDOC_VERSION\pandoc.exe"
          $notes = Join-Path $env:RUNNER_TEMP "Notizen mit Leerzeichen"
          $target = Join-Path $env:RUNNER_TEMP "Export Ziel\notiz.pdf"
          New-Item -ItemType Directory -Force -Path "$notes\bilder", (Split-Path $target) | Out-Null
          [IO.File]::WriteAllText("$notes\bilder\grafik.svg", '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60"><rect width="200" height="60" fill="#1f6f6a"/></svg>')
          # Windows PowerShell 5.1 reads this script as ANSI: build the dash from its code point
          $dash = [char]0x2013
          [IO.File]::WriteAllText("$notes\notiz.md", "---`ntitle: `"Bote`"`nclient: `"Muster GmbH`"`n---`n`n# Test`n`n![Grafik](bilder/grafik.svg)`n`n- [ ] Aufgabe $dash Name, bis 17.10.`n", (New-Object System.Text.UTF8Encoding $false))
          Push-Location $notes
          & $pandoc -d "$zettlr\defaults\rf-doc.yaml" notiz.md -o $target
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 0) { throw "export failed with $exit" }
          $head = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($target), 0, 5)
          if ($head -ne "%PDF-") { throw "no PDF at $target" }
          Write-Host "ok: $target"
          exit 0
