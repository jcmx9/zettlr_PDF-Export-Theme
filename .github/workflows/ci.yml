name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # The Pandoc version Zettlr ships with
  PANDOC_VERSION: "3.10.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install lint tooling
        run: npm ci

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint shell scripts (shellcheck)
        run: shellcheck install.sh scripts/*.sh

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Lint Python scripts (ruff)
        run: uvx ruff check scripts/

      - name: Check color contrast (WCAG AA)
        run: python3 scripts/check_contrast.py

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/

  bootstrap-unix:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall
        run: |
          set -euo pipefail
          if [ "$(uname -s)" = Darwin ]; then
            zettlr="$HOME/Library/Application Support/zettlr"
            typora="$HOME/Library/Application Support/abnerworks.Typora/themes"
          else
            zettlr="$HOME/.config/zettlr"
            typora="$HOME/.config/Typora/themes"
          fi
          mkdir -p "$zettlr" "$typora/source"
          printf '/* own rule */\n' > "$zettlr/custom.css"
          cp "$zettlr/custom.css" original.css
          # Typora themes left by earlier versions, next to a foreign theme
          printf '/* Generated by scripts/fetch_fonts.py */\n' > "$typora/source/fonts.css"
          touch "$typora/source.css" "$typora/source-dark.css" "$typora/other.css"

          bash install.sh --bundle dist/zettlr-pdf-export-theme.tar.gz
          bash install.sh --bundle dist/zettlr-pdf-export-theme.tar.gz
          test -f "$zettlr/defaults/Source PDF.yaml"
          test -f "$zettlr/snippets/protokoll.tpl.md"
          test -f "$zettlr/source-zettlr-fonts.css"
          test ! -e "$typora/source.css" && test ! -e "$typora/source-dark.css" && test ! -e "$typora/source"
          test -f "$typora/other.css"
          head -n 1 "$zettlr/custom.css" | grep -qF 'source-zettlr.css'

          app="$HOME/.local/share/zettlr-pdf-export-theme"
          printf '#set text(font: "SourceSans3VF")\nHallo\n' > t.typ
          "$app/bin/typst" compile --ignore-system-fonts --font-path "$app/current/typst/fonts" t.typ t.pdf
          test -s t.pdf
          "$app/bin/typst" fonts --ignore-system-fonts --font-path "$app/current/typst/fonts" | grep -qx 'Noto Emoji'

          # End to end: export the test notes with the installed profile
          if [ "$(uname -s)" = Darwin ]; then
            curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
            unzip -q pandoc.zip
            export PATH="$PWD/pandoc-$PANDOC_VERSION-arm64/bin:$PATH"
            brew install --quiet poppler
          else
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz" | tar -xz
            export PATH="$PWD/pandoc-$PANDOC_VERSION/bin:$PATH"
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils >/dev/null
          fi
          pandoc --version | head -n 1
          ./scripts/test_pdf.sh "$zettlr/defaults/Source PDF.yaml"

          bash install.sh --uninstall
          cmp "$zettlr/custom.css" original.css
          test ! -e "$app"

  bootstrap-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/

      - name: Install, update and uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zettlr = Join-Path $env:APPDATA "zettlr"
          $typora = Join-Path $env:APPDATA "Typora\themes"
          New-Item -ItemType Directory -Force -Path $zettlr, "$typora\source" | Out-Null
          [IO.File]::WriteAllText("$zettlr\custom.css", "/* own rule */`r`n")
          Copy-Item "$zettlr\custom.css" original.css
          # Typora themes left by earlier versions, next to a foreign theme
          [IO.File]::WriteAllText("$typora\source\fonts.css", "/* Generated by scripts/fetch_fonts.py */")
          foreach ($t in @("source.css", "source-dark.css", "other.css")) { [IO.File]::WriteAllText("$typora\$t", "") }

          $code = Get-Content -Raw install.ps1
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-pdf-export-theme.zip
          & ([scriptblock]::Create($code)) -Bundle dist\zettlr-pdf-export-theme.zip
          foreach ($f in @("$zettlr\defaults\Source PDF.yaml", "$zettlr\snippets\protokoll.tpl.md", "$zettlr\source-zettlr-fonts.css", "$typora\other.css")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" }
          }
          foreach ($f in @("$typora\source.css", "$typora\source-dark.css", "$typora\source")) {
            if (Test-Path -LiteralPath $f) { throw "legacy Typora file left: $f" }
          }

          $app = Join-Path $env:LOCALAPPDATA "zettlr-pdf-export-theme"
          [IO.File]::WriteAllText("$PWD\t.typ", "#set text(font: `"SourceSans3VF`")`nHallo`n")
          & "$app\bin\typst.exe" compile --ignore-system-fonts --font-path "$app\current\typst\fonts" t.typ t.pdf
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path t.pdf)) { throw "typst failed" }
          $families = & "$app\bin\typst.exe" fonts --ignore-system-fonts --font-path "$app\current\typst\fonts"
          if ($families -notcontains "Noto Emoji") { throw "Noto Emoji missing" }

          # End to end: export the test notes with the installed profile
          Invoke-WebRequest -UseBasicParsing -OutFile pandoc.zip "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip"
          Expand-Archive pandoc.zip -DestinationPath .
          $pandoc = Join-Path $PWD "pandoc-$env:PANDOC_VERSION\pandoc.exe"
          Push-Location tests\fixtures
          foreach ($note in @("all-elements.md", "english.md", "edge-cases.md")) {
            & $pandoc -d "$zettlr\defaults\Source PDF.yaml" $note -o "$env:RUNNER_TEMP\$note.pdf"
            if ($LASTEXITCODE -ne 0 -or (Get-Item "$env:RUNNER_TEMP\$note.pdf").Length -eq 0) { throw "export of $note failed" }
          }
          Pop-Location

          & ([scriptblock]::Create($code)) -Uninstall
          if ((Get-FileHash "$zettlr\custom.css").Hash -ne (Get-FileHash original.css).Hash) { throw "custom.css not restored" }
          if (Test-Path -LiteralPath $app) { throw "app folder left behind" }
