name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install lint tooling
        run: npm ci

      - name: Lint CSS (stylelint)
        run: npm run lint:css

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Lint Python scripts (ruff)
        run: uvx ruff check scripts/

      - name: Check color contrast (WCAG AA)
        run: python3 scripts/check_contrast.py
